
dataset:
  repository_id: nguyenvulebinh/ViCocktail
  default_split: train

audio:
  target_sample_rate: 16000   # in Hz (standard in AVSR/ASR)
  format: s16
  layout: mono

face_tracking:
  min_detection_confidence: 0.8
  min_landmark_confidence: 0.6
  min_face_area_ratio: 0.005
  min_mouth_landmark_confidence: 0.6
  min_mouth_landmarks_in_frame_ratio: 0.9
  min_detection_rate: 0.9
  max_missing_run: 10
  max_center_distance_ratio: 0.75
  min_association_iou: 0.1
  ambiguity_score_margin: 0.15
  initial_face_area_margin_ratio: 0.15
  max_face_area_change_ratio: 2.0
  max_out_of_frame_ratio: 0.1
  max_ambiguous_frames: 0
  max_edge_missing_run: 0
  min_detected_frames: 2

  max_short_visual_gap: 3
  min_visual_run: 2
mouth_roi:
  size: 96                     # px, theo cấu hình AV-HuBERT trong paper gốc
  landmarks: [61, 291, 0, 17, 269, 405]

text:
  keep_diacritics: true

model:
  repository_id: nguyenvulebinh/AV-HuBERT-CTC-Attention-VI
  revision: b8a1fa5d6079701b3f8f791bfd601057fbd23de3
  cache_dir: .cache/models
  device: auto
  dtype: float32

tokenizer:
  model_path: assets/tokenizers/vi/unigram2048.model
  units_path: assets/tokenizers/vi/unigram2048_units.txt

paths:
  samples_dir: /samples/official